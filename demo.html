<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Three.js + Rapier Demo</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
#status {
  position: fixed;
  top: 10px;
  left: 10px;
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  padding: 5px 10px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
  border-radius: 4px;
  z-index: 1000;
}
  </style>
</head>
<body>
  <div id="status">Running...</div>
  <script type="module">

    // Load Three.js and Rapier from CDN
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158/build/three.module.js';
    import initRapier from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d@0.10.0/rapier.js';

    (async () => {
  
      const statusDiv = document.getElementById('status');

      // ----- Three.js setup -----
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      camera.position.set(0, 5, 10);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Light
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      // Ground (Three.js mesh)
      const groundGeo = new THREE.BoxGeometry(20, 1, 20);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x808080 });
      const groundMesh = new THREE.Mesh(groundGeo, groundMat);
      groundMesh.position.y = -0.5; // align with physics ground
      scene.add(groundMesh);
      statusDiv.textContent += ' → Three.js initialized';
      console.log('Three.js initialized');

      // Initialize Rapier
      await initRapier();
      statusDiv.textContent += ' → Rapier initialized';
      console.log('Rapier initialized');

      const RAPIER = rapier; // global provided by Rapier init script


      // Ground plane already created as groundMesh

      // Helper to create a Three.js mesh and a Rapier body
      const objects = [];
      function createBox(size, position, color) {
        const geo = new THREE.BoxGeometry(size.x, size.y, size.z);
        const mat = new THREE.MeshStandardMaterial({ color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(position);
        scene.add(mesh);
        const bodyDesc = RAPIER.RigidBodyDesc.dynamic().setTranslation(position.x, position.y, position.z);
        const body = world.createRigidBody(bodyDesc);
        const colliderDesc = RAPIER.ColliderDesc.cuboid(size.x / 2, size.y / 2, size.z / 2);
        world.createCollider(colliderDesc, body);
        objects.push({ mesh, body });
      }

      function createSphere(radius, position, color) {
        const geo = new THREE.SphereGeometry(radius, 32, 32);
        const mat = new THREE.MeshStandardMaterial({ color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(position);
        scene.add(mesh);
        const bodyDesc = RAPIER.RigidBodyDesc.dynamic().setTranslation(position.x, position.y, position.z);
        const body = world.createRigidBody(bodyDesc);
        const colliderDesc = RAPIER.ColliderDesc.ball(radius);
        world.createCollider(colliderDesc, body);
        objects.push({ mesh, body });
      }

      // ----- Rapier physics setup -----
      const gravity = new RAPIER.Vector3(0, -9.81, 0);
      const world = new RAPIER.World(gravity);
statusDiv.textContent += ' → Rapier world created';
      console.log('Rapier world created');

      // Static ground collider (matches ground mesh)
      const groundBodyDesc = RAPIER.RigidBodyDesc.fixed().setTranslation(0, -0.5, 0);
      const groundBody = world.createRigidBody(groundBodyDesc);
      statusDiv.textContent += ' → Ground collider created';
      console.log('Ground collider created');
      const groundColliderDesc = RAPIER.ColliderDesc.cuboid(10, 0.5, 10);
      world.createCollider(groundColliderDesc, groundBody);

      // Create some falling boxes and spheres
      const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00];
      for (let i = 0; i < 5; i++) {
        const size = new THREE.Vector3(1, 1, 1);
        const pos = new THREE.Vector3((Math.random() - 0.5) * 8, 5 + i * 2, (Math.random() - 0.5) * 8);
        createBox(size, pos, colors[i % colors.length]);
      }
      for (let i = 0; i < 5; i++) {
        const radius = 0.5;
        const pos = new THREE.Vector3((Math.random() - 0.5) * 8, 8 + i * 2, (Math.random() - 0.5) * 8);
        createSphere(radius, pos, colors[(i + 2) % colors.length]);
      }

      const timeStep = 1 / 60;

      function animate() {
        requestAnimationFrame(animate);
        world.step(); // advance physics simulation

        // Sync all objects
        for (const obj of objects) {
          const pos = obj.body.translation();
          const rot = obj.body.rotation();
          obj.mesh.position.set(pos.x, pos.y, pos.z);
          obj.mesh.quaternion.set(rot.x, rot.y, rot.z, rot.w);
        }

        renderer.render(scene, camera);
      }

      // Handle window resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    })().catch(e => {
      console.error(e);
      const statusDiv = document.getElementById('status');
      if (statusDiv) statusDiv.textContent = e.message;
    });
  </script>
</body>
</html>
